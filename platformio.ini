; PlatformIO build for this ESP-IDF project.
; Official workflow remains idf.py / Espressif ESP-IDF extension (see README.md).

[platformio]
default_envs = esp32doit-devkit-v1
src_dir = main

[env]
platform = espressif32 @ >=6.12.0
framework = espidf
monitor_speed = 115200
board_build.cmake_extra_args = -DBUILD_WITH_PLATFORMIO=1

; DOIT ESP32 DevKit V1 (30-pin, ESP32-WROOM-32)
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
build_flags =
    -DBOARD_DOIT_ESP32_DEVKIT_V1

; DJI reference hardware (ESP32-C6-DevKitC-1 + LC76G)
[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1

; Other ESP32-WROOM devkits
[env:esp32dev]
board = esp32dev

; ESP32-WROVER-KIT (PSRAM)
[env:esp-wrover-kit]
board = esp-wrover-kit

; LilyGO Lily Pi (ESP32-WROVER, 16MB flash, 8MB PSRAM, ST7796 480x320 K113)
[env:lilygo-lily-pi]
board = esp-wrover-kit
board_build.sdkconfig = sdkconfig.lilygo-lily-pi
board_build.sdkconfig_defaults = sdkconfig.lilygo-lily-pi.defaults
build_flags =
    -DBOARD_LILYGO_LILY_PI=1

; Waveshare ESP32-S3-Touch-LCD-1.28 (GC9A01 240×240, CST816S touch, QMI8658 IMU)
; CH343 USB-UART: prefer /dev/cu.wchusbserial* over /dev/cu.usbmodem* (checksum errors on wrong port).
; If upload fails: hold BOOT, tap RESET, release BOOT, then retry.
[env:waveshare-esp32-s3-touch-lcd-1]
board = esp32-s3-devkitc-1
board_build.sdkconfig = sdkconfig.waveshare-esp32-s3-touch-lcd-1
board_build.sdkconfig_defaults = sdkconfig.defaults.esp32s3,sdkconfig.waveshare-esp32-s3-touch-lcd-1.defaults
board_build.partitions = partitions_waveshare.csv
upload_speed = 460800
monitor_speed = 115200
; Use "Upload" (pio run -t upload), not "Upload Filesystem" — no SPIFFS partition on this board.
